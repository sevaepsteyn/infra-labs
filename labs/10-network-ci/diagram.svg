<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 288' role='img' aria-label='Every change is tested on a throwaway copy of the network' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <defs>
    <marker id='ci-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
    <path d='M0 0L10 5L0 10z' fill='#8c959f'/>
    </marker>
    </defs>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Every change is tested on a throwaway copy of the network</text>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M188 84H204' marker-end='url(#ci-arrow)'/>
    <path d='M368 84H384' marker-end='url(#ci-arrow)'/>
    <path d='M548 84H564' marker-end='url(#ci-arrow)'/>
    <path d='M646 112V160' marker-end='url(#ci-arrow)'/>
    <path d='M564 188H548' marker-end='url(#ci-arrow)'/>
    <path d='M646 216V248H104V112' marker-end='url(#ci-arrow)'/>
    </g>
    <text x='556' y='152' text-anchor='middle' font-size='11.5' fill='#59636e'>pass</text>
    <text x='380' y='268' text-anchor='middle' font-size='11.5' fill='#59636e'>fail: results posted to the pull request</text>
    <g>
    <rect x='24' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='106' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Pull request</text>
    <text x='106' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Config change in git</text>
    </g>
    <g>
    <rect x='204' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='286' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>CI runner</text>
    <text x='286' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>GitHub Actions on host</text>
    </g>
    <g>
    <rect x='384' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='466' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Deploy topology</text>
    <text x='466' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>containerlab deploy</text>
    </g>
    <g>
    <rect x='564' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='646' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Apply configs</text>
    <text x='646' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>gNMI or Ansible</text>
    </g>
    <g>
    <rect x='564' y='160' width='164' height='56' rx='8' fill='#0969da' fill-opacity='0.12' stroke='#0969da' stroke-width='2'/>
    <text x='646' y='184' text-anchor='middle' font-weight='600' fill='#1f2328'>Run checks</text>
    <text x='646' y='200' text-anchor='middle' font-size='11.5' fill='#59636e'>BGP, pings, policy</text>
    </g>
    <g>
    <rect x='384' y='160' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='466' y='184' text-anchor='middle' font-weight='600' fill='#1f2328'>Merge</text>
    <text x='466' y='200' text-anchor='middle' font-size='11.5' fill='#59636e'>Then roll out</text>
    </g>
    </svg>
