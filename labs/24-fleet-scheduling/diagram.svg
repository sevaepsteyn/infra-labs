    <rect x='260' y='280' width='240' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='380' y='304' text-anchor='middle' font-weight='600' fill='#1f2328'>Node failure</text>
    <text x='380' y='320' text-anchor='middle' font-size='11.5' fill='#59636e'>Job requeued, not stuck</text>
