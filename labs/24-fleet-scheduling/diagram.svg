<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 360' role='img' aria-label='Jobs wait in a queue until a whole block of nodes is free' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Jobs wait in a queue until a whole block of nodes is free</text>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M224 84H264'/>
    <path d='M496 84H536'/>
    <path d='M340 112L224 168'/>
    <path d='M224 224L340 280'/>
    </g>
    <g fill='none' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='4 4'>
    <path d='M420 112L536 168'/>
    </g>
    <g>
    <rect x='24' y='56' width='200' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='124' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Training job</text>
    <text x='124' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>JobSet, 4 pods</text>
    </g>
    <g>
    <rect x='264' y='56' width='232' height='56' rx='8' fill='#0969da' fill-opacity='0.12' stroke='#0969da' stroke-width='2'/>
    <text x='380' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Kueue</text>
    <text x='380' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Queue, quota, gang admission</text>
    </g>
    <g>
    <rect x='536' y='56' width='200' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='636' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Second cluster</text>
    <text x='636' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Reached via MultiKueue</text>
    </g>
    <g>
    <rect x='104' y='168' width='240' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='224' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>Block A, 2 nodes</text>
