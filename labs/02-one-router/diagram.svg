<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 248' role='img' aria-label='Both nodes announce the service IP to one router' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Both nodes announce the service IP to one router</text>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M470 84H540'/>
    <path d='M350 112L230 168'/>
    <path d='M410 112L530 168'/>
    </g>
    <g>
    <rect x='290' y='56' width='180' height='56' rx='8' fill='#0969da' fill-opacity='0.12' stroke='#0969da' stroke-width='2'/>
    <text x='380' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>FRR router</text>
    <text x='380' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>eBGP to both nodes</text>
    </g>
    <g>
    <rect x='540' y='56' width='180' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='630' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Test client</text>
    <text x='630' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>curl the service IP</text>
    </g>
    <g>
    <rect x='140' y='168' width='180' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='230' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>kind control plane</text>
    <text x='230' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>Cilium BGP peer</text>
    </g>
    <g>
    <rect x='440' y='168' width='180' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='530' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>kind worker</text>
    <text x='530' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>Announces the service IP</text>
    </g>
    </svg>
