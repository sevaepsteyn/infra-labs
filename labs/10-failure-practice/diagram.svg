<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 248' role='img' aria-label='Inject a fault, then time detection and recovery' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <defs>
    <marker id='fail-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
    <path d='M0 0L10 5L0 10z' fill='#8c959f'/>
    </marker>
    </defs>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Inject a fault, then time detection and recovery</text>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M188 84H204' marker-end='url(#fail-arrow)'/>
    <path d='M368 84H384' marker-end='url(#fail-arrow)'/>
    <path d='M548 84H564' marker-end='url(#fail-arrow)'/>
    </g>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M136 168L96 112'/>
    <path d='M380 168L116 112'/>
    <path d='M624 168L136 112'/>
    </g>
    <g>
    <rect x='24' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='106' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Inject a fault</text>
    <text x='106' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Pick one below</text>
    </g>
    <g>
    <rect x='204' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='286' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Detect</text>
    <text x='286' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>BFD, BGP hold timer</text>
    </g>
    <g>
    <rect x='384' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='466' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Recover</text>
    <text x='466' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Reroute, reschedule</text>
    </g>
    <g>
    <rect x='564' y='56' width='164' height='56' rx='8' fill='#0969da' fill-opacity='0.12' stroke='#0969da' stroke-width='2'/>
    <text x='646' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Measure</text>
    <text x='646' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Seconds to recover</text>
    </g>
    <g>
    <rect x='24' y='168' width='224' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='136' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>tc netem</text>
    <text x='136' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>Gray failure: 1% loss</text>
    </g>
    <g>
    <rect x='268' y='168' width='224' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='380' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>Link or node down</text>
    <text x='380' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>containerlab, docker stop</text>
    </g>
    <g>
    <rect x='512' y='168' width='224' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='624' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>Chaos Mesh</text>
    <text x='624' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>Pod and network faults</text>
    </g>
    </svg>
