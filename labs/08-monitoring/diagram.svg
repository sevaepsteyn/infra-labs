<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 312' role='img' aria-label='Switch telemetry, flows and cluster metrics land in one Prometheus' font-size='13'>
