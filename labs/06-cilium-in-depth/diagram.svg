<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 352' role='img' aria-label='Cilium replaces kube-proxy, encrypts node to node, and pins egress' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Cilium replaces kube-proxy, encrypts node to node, and pins egress</text>
    <g>
    <rect x='24' y='48' width='336' height='184' rx='8' fill='none' stroke='#8c959f' stroke-width='1' stroke-dasharray='4 4'/>
    <text x='40' y='220' font-size='11.5' fill='#59636e'>Node A</text>
    <rect x='40' y='64' width='304' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='192' y='88' text-anchor='middle' font-weight='600' fill='#1f2328'>Pod: frontend</text>
    <text x='192' y='104' text-anchor='middle' font-size='11.5' fill='#59636e'>L7 policy enforced by Envoy</text>
    <rect x='40' y='136' width='304' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='192' y='160' text-anchor='middle' font-weight='600' fill='#1f2328'>eBPF datapath</text>
    <text x='192' y='176' text-anchor='middle' font-size='11.5' fill='#59636e'>No kube-proxy, WireGuard to peers</text>
    </g>
    <g>
    <rect x='400' y='48' width='336' height='184' rx='8' fill='none' stroke='#8c959f' stroke-width='1' stroke-dasharray='4 4'/>
    <text x='416' y='220' font-size='11.5' fill='#59636e'>Node B</text>
    <rect x='416' y='64' width='304' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='568' y='88' text-anchor='middle' font-weight='600' fill='#1f2328'>Pod: backend</text>
    <text x='568' y='104' text-anchor='middle' font-size='11.5' fill='#59636e'>Identity-based L3/L4 policy</text>
    <rect x='416' y='136' width='304' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='568' y='160' text-anchor='middle' font-weight='600' fill='#1f2328'>eBPF datapath</text>
    <text x='568' y='176' text-anchor='middle' font-size='11.5' fill='#59636e'>No kube-proxy, WireGuard to peers</text>
    </g>
    <g>
    <path d='M344 164H416' fill='none' stroke='#0969da' stroke-width='2'/>
    </g>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M192 232L300 272'/>
    <path d='M568 232L460 272'/>
    <path d='M500 300H540'/>
    </g>
    <g>
    <rect x='260' y='272' width='240' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='380' y='296' text-anchor='middle' font-weight='600' fill='#1f2328'>Egress gateway</text>
    <text x='380' y='312' text-anchor='middle' font-size='11.5' fill='#59636e'>One fixed source IP out</text>
    </g>
    <g>
    <rect x='540' y='272' width='196' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='638' y='296' text-anchor='middle' font-weight='600' fill='#1f2328'>External service</text>
    <text x='638' y='312' text-anchor='middle' font-size='11.5' fill='#59636e'>Sees a single source IP</text>
    </g>
