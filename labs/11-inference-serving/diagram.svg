<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 360' role='img' aria-label='One gateway routes each request to a model server' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>One gateway routes each request to a model server</text>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M184 84H264'/>
    <path d='M496 84H560'/>
    <path d='M340 112L260 168'/>
    <path d='M420 112L540 168'/>
    </g>
    <g fill='none' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='4 4'>
    <path d='M340 280L260 224'/>
    <path d='M420 280L540 224'/>
    </g>
    <g>
    <rect x='24' y='56' width='160' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='104' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Client</text>
    <text x='104' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Sends prompts</text>
    </g>
    <g>
    <rect x='264' y='56' width='232' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='380' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Gateway (Istio or agentgateway)</text>
    <text x='380' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Gateway API, BGP-announced IP</text>
    </g>
    <g>
    <rect x='560' y='56' width='176' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='648' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Inference extension</text>
    <text x='648' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Picks a model server</text>
    </g>
    <g>
    <rect x='140' y='168' width='240' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='260' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>Model servers, stable</text>
    <text x='260' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>vLLM simulator; llama.cpp for load</text>
    </g>
    <g>
    <rect x='420' y='168' width='240' height='56' rx='8' fill='#0969da' fill-opacity='0.12' stroke='#0969da' stroke-width='2'/>
    <text x='540' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>Model servers, canary</text>
    <text x='540' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>New version, small share</text>
    </g>
    <g>
    <rect x='260' y='280' width='240' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='380' y='304' text-anchor='middle' font-weight='600' fill='#1f2328'>Autoscaler</text>
    <text x='380' y='320' text-anchor='middle' font-size='11.5' fill='#59636e'>HPA or KEDA on queue depth</text>
    </g>
