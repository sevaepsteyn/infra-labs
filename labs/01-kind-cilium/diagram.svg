<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 264' role='img' aria-label='One kind cluster, Cilium as the CNI, Hubble watching flows' font-size='13'>
