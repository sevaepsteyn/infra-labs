<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 392' role='img' aria-label='Batch jobs and services share one cluster' font-size='13'>
