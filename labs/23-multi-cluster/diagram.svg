<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 456' role='img' aria-label='Two clusters in two regions share one global service' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Two clusters in two regions share one global service</text>
