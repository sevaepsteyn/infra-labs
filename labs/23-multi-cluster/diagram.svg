    <text x='190' y='104' text-anchor='middle' font-size='11.5' fill='#59636e'>Cilium, Cluster Mesh peer</text>
    <rect x='40' y='136' width='300' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
