<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 376' role='img' aria-label='Two encrypted tunnels with BGP join the lab to a cloud network' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Two encrypted tunnels with BGP join the lab to a cloud network</text>
    <g>
    <rect x='280' y='56' width='200' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='380' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Terraform</text>
    <text x='380' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Builds both sides</text>
    </g>
    <g fill='none' stroke='#8c959f' stroke-width='1.25' stroke-dasharray='4 4'>
    <path d='M330 112L190 144'/>
    <path d='M430 112L570 144'/>
    </g>
    <g>
    <rect x='24' y='144' width='332' height='208' rx='8' fill='none' stroke='#8c959f' stroke-width='1' stroke-dasharray='4 4'/>
    <text x='40' y='340' font-size='11.5' fill='#59636e'>Lab on the x86 host</text>
    <rect x='40' y='168' width='300' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='190' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>Lab edge (VyOS)</text>
    <text x='190' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>BGP over both tunnels</text>
    <rect x='40' y='256' width='300' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='190' y='280' text-anchor='middle' font-weight='600' fill='#1f2328'>kind cluster</text>
    <text x='190' y='296' text-anchor='middle' font-size='11.5' fill='#59636e'>Cilium BGP to the edge</text>
    </g>
    <g>
    <rect x='404' y='144' width='332' height='208' rx='8' fill='none' stroke='#8c959f' stroke-width='1' stroke-dasharray='4 4'/>
    <text x='420' y='340' font-size='11.5' fill='#59636e'>Cloud VPC</text>
    <rect x='420' y='168' width='300' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='570' y='192' text-anchor='middle' font-weight='600' fill='#1f2328'>Cloud VPN gateway</text>
    <text x='570' y='208' text-anchor='middle' font-size='11.5' fill='#59636e'>Managed gateway or a VyOS VM</text>
    <rect x='420' y='256' width='300' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='570' y='280' text-anchor='middle' font-weight='600' fill='#1f2328'>Cloud workload</text>
    <text x='570' y='296' text-anchor='middle' font-size='11.5' fill='#59636e'>Private subnet</text>
    </g>
    <g fill='none' stroke='#8c959f' stroke-width='1.25'>
    <path d='M190 224V256'/>
    <path d='M570 224V256'/>
    </g>
    <g fill='none' stroke='#0969da' stroke-width='2'>
    <path d='M340 186H420'/>
    <path d='M340 206H420'/>
    </g>
    </svg>
