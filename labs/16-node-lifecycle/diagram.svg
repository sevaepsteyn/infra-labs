    <text x='286' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Tinkerbell</text>
    </g>
    <g>
    <rect x='384' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='466' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Provision and join</text>
    <text x='466' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Cluster API</text>
    </g>
    <g>
    <rect x='564' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
    <text x='646' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>Serving</text>
    <text x='646' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Node in the cluster</text>
