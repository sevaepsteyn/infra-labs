    <text x='106' y='80' text-anchor='middle' font-weight='600' fill='#1f2328'>New node</text>
    <text x='106' y='96' text-anchor='middle' font-size='11.5' fill='#59636e'>Empty libvirt VM</text>
    </g>
    <g>
    <rect x='204' y='56' width='164' height='56' rx='8' fill='none' stroke='#8c959f' stroke-width='1.25'/>
