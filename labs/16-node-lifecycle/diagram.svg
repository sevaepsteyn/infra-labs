<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 240' role='img' aria-label='Unhealthy nodes are drained, reimaged and rejoin without a human' font-size='13'>
    <rect width='100%' height='100%' fill='#ffffff'/>
    <defs>
    <marker id='life-arrow' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'>
    <path d='M0 0L10 5L0 10z' fill='#8c959f'/>
    </marker>
    </defs>
    <text x='24' y='32' font-size='15' font-weight='600' fill='#1f2328'>Unhealthy nodes are drained, reimaged and rejoin without a human</text>
