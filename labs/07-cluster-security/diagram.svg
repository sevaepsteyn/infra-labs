<svg xmlns='http://www.w3.org/2000/svg' font-family='-apple-system, Segoe UI, Helvetica, Arial, sans-serif' viewBox='0 0 760 344' role='img' aria-label='Only signed images that pass policy reach the cluster' font-size='13'>
