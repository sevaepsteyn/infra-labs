# Exercise 3: exercise 2 plus a ConfigMap and a Secret, each reaching the app
# as an environment variable, and the ConfigMap also as a file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - ../02-services
  - web-config.yaml
  - db-secret.yaml
patches:
  - path: web-patch.yaml
