apiVersion: apps/v1
kind: Deployment
metadata:
  name: b
  namespace: broken
spec:
  replicas: 1
  selector:
    matchLabels:
      app: b
  template:
    metadata:
      labels:
        app: b
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            periodSeconds: 3
            failureThreshold: 2
