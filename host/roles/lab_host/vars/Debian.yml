---
lab_base_packages:
  - iproute2
  - tcpdump
  - tshark
  - ethtool
  - iperf3
  - jq
  - git
  - tar
  # So the playbook can also be run on the host itself.
  - ansible-core
lab_zram_packages:
  - systemd-zram-generator
lab_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
lab_docker_repo_distro: "{{ ansible_facts['distribution'] | lower }}"
lab_libvirt_packages:
  - qemu-system-x86
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
lab_libvirt_services:
  - libvirtd
