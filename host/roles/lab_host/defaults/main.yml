      arm64: 20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
  - name: kubectl
    version: "1.37.2"
    url: "https://dl.k8s.io/release/v1.37.2/bin/linux/{{ lab_arch }}/kubectl"
    version_args: version --client
    sha256:
      amd64: c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4
      arm64: fcc16f63186659d9722014b7e02d5fdd2d4e669cb8c0ab66365d7d3b8ba03509
  - name: helm
    version: "4.3.2"
