---
# Defaults describe a dedicated lab host, as in docs/host-setup.md.
# For a shared or production host, turn features off per host in the inventory
# (see inventory/hosts.example.yml).

# Everything the role installs goes under here. The only files it writes
# elsewhere are the small config files under /etc that the system reads.
lab_dir: /opt/infra-lab
# Downloaded tool archives.
lab_cache_dir: "{{ lab_dir }}/cache"
# Where tool binaries are installed. Added to the end of login shells' PATH.
lab_bin_dir: "{{ lab_dir }}/bin"

# --- Features -----------------------------------------------------------------
lab_base_packages_enabled: true

lab_sysctl_enabled: true
# Minimum values. A key already at or above its value is left alone.
lab_sysctl:
  fs.inotify.max_user_watches: 524288
  fs.inotify.max_user_instances: 512

# MPLS forwarding for Linux nodes (lab 19).
lab_mpls_enabled: true
lab_mpls_modules:
  - mpls_router
  - mpls_iptunnel
lab_mpls_platform_labels: 100000

# Kernel same-page merging, so identical VMs share memory.
lab_ksm_enabled: true

# Compressed swap in RAM. Skipped if the host already has zram swap or a
# zram-generator config this role did not write.
lab_zram_enabled: true
lab_zram_size_mb: 8192

# Docker CE, installed only where no Docker daemon is present. A Docker that
# is already there is never upgraded, reconfigured or restarted. The role
# never configures Docker's networks: docker0 and its NAT stay as Docker
# sets them up.
lab_docker_enabled: true

# libvirt and QEMU for VM nodes. libvirt's default NAT network (virbr0, with
# its own DNS and DHCP) is left as the host has it. Set
# lab_libvirt_default_network_off to stop it and disable its autostart.
lab_libvirt_enabled: true
lab_libvirt_default_network_off: false

# Users to add to lab_user_groups. Docker group membership is root-equivalent.
lab_users: []
lab_user_groups:
  - docker

lab_tools_enabled: true

# --- Tool versions ------------------------------------------------------------
# To upgrade a tool, change version, url and both sha256 values together.
# Checksums come from each project's published checksum file. lab_arch is
# amd64 or arm64. Give member for a tool that ships as an archive: the path of
# the binary inside it. version_args is how verify runs the tool (default:
# version).

lab_tools:
  - name: kind
    version: "0.33.0"
    url: "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-{{ lab_arch }}"
    sha256:
