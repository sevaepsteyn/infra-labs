---
- name: Install libvirt and QEMU
  ansible.builtin.package:
    name: "{{ lab_libvirt_packages }}"
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable and start libvirt
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: "{{ lab_libvirt_services }}"
  when: not ansible_check_mode

# The default network starts its own dnsmasq for DNS and DHCP on virbr0. It is
# left alone unless lab_libvirt_default_network_off is set, for a host where
# that would collide with services already there.
- name: Turn the default libvirt network off
  ansible.builtin.shell: |
    set -u
    changed=0
    info=$(virsh -c qemu:///system net-info default 2>/dev/null) || exit 0
    if echo "$info" | grep -Eq '^Active: +yes'; then virsh -c qemu:///system net-destroy default >/dev/null && changed=1; fi
    if echo "$info" | grep -Eq '^Autostart: +yes'; then virsh -c qemu:///system net-autostart --disable default >/dev/null && changed=1; fi
    echo "changed=$changed"
  register: lab_libvirt_net
  changed_when: "'changed=1' in lab_libvirt_net.stdout"
  when:
    - lab_libvirt_default_network_off | bool
    - not ansible_check_mode
