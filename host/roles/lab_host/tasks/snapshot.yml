---
# A readable record of the host before this role first changed it, for
# comparing against later. Written once; later runs leave it alone. Nothing in
# the role reads it back.

- name: Create the snapshot directory
  ansible.builtin.file:
    path: "{{ lab_snapshot_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Take a snapshot of the host before the first change
  ansible.builtin.shell: |
    set -u
    d={{ lab_snapshot_dir }}/snapshot
    rm -rf "$d.tmp" && mkdir -p "$d.tmp" && cd "$d.tmp" || exit 1
    date -u +%Y-%m-%dT%H:%M:%SZ > taken-at.txt
    uname -a > uname.txt
    sysctl -a > sysctl.txt 2>/dev/null || true
    lsmod > lsmod.txt || true
    (rpm -qa 2>/dev/null | sort || dpkg-query -W 2>/dev/null) > packages.txt || true
    ip -d addr > ip-addr.txt 2>&1 || true
    ip route > ip-route.txt 2>&1 || true
    ip -6 route > ip6-route.txt 2>&1 || true
    ss -tulnp > listening.txt 2>&1 || true
    systemctl list-units --type=service --state=running --no-pager > services.txt 2>&1 || true
    swapon --show > swap.txt 2>&1 || true
    getent group > groups.txt 2>&1 || true
    ls -la {{ lab_bin_dir }} > bin-dir.txt 2>&1 || true
    nft list ruleset > nft-ruleset.txt 2>&1 || true
    if command -v docker >/dev/null 2>&1; then
      docker ps -a --no-trunc > docker-ps.txt 2>&1 || true
      docker network ls > docker-networks.txt 2>&1 || true
      docker info > docker-info.txt 2>&1 || true
    fi
    cd {{ lab_snapshot_dir }} && tar -czf snapshot.tar.gz.tmp -C "$d.tmp" . \
      && rm -rf "$d.tmp" && mv snapshot.tar.gz.tmp snapshot.tar.gz
  args:
    creates: "{{ lab_snapshot_dir }}/snapshot.tar.gz"
