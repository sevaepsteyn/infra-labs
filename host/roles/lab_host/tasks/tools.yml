---
- name: Create the lab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ lab_dir }}"
    - "{{ lab_cache_dir }}"
    - "{{ lab_bin_dir }}"

# Appended, so a tool of the same name that the host already has on PATH
# still wins.
- name: Add the tool directory to PATH for login shells
  ansible.builtin.copy:
    content: |
      # {{ lab_managed_marker }}.
      case ":$PATH:" in
        *":{{ lab_bin_dir }}:"*) ;;
        *) PATH="$PATH:{{ lab_bin_dir }}" ;;
      esac
    dest: "{{ lab_path_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Install each tool
  ansible.builtin.include_tasks: tool.yml
  loop: "{{ lab_tools }}"
  loop_control:
    loop_var: lab_tool
    label: "{{ lab_tool.name }} {{ lab_tool.version }}"
  vars:
    lab_tool_dir: "{{ lab_cache_dir }}/{{ lab_tool.name }}-{{ lab_tool.version }}"
    lab_tool_file: "{{ lab_tool_dir }}/{{ lab_tool.url | basename }}"
    lab_tool_src: "{{ (lab_tool_dir ~ '/unpacked/' ~ lab_tool.member) if lab_tool.member is defined else lab_tool_file }}"
    lab_tool_dest: "{{ lab_bin_dir }}/{{ lab_tool.name }}"

# Proves each binary is the right build for this machine, not just present.
- name: Run each tool
  ansible.builtin.command: "{{ lab_bin_dir }}/{{ item.name }} {{ item.version_args | default('version') }}"
  loop: "{{ lab_tools }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false
  when: not ansible_check_mode
